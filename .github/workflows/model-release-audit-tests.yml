name: Model release verifier self-tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/verify_model_release.py'
      - 'tests/test_model_release_audit.py'
      - '.github/workflows/model-release-audit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/verify_model_release.py'
      - 'tests/test_model_release_audit.py'
      - '.github/workflows/model-release-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verifier-tests:
    name: Offline archive verifier self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run synthetic security and integrity tests
        run: PYTHONPATH=tools python3 -m unittest discover -s tests -p 'test_model_release_audit.py' -v
